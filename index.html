<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hop Hop</title>
<style>
html,body{margin:0;height:100%;background:#0d1030;color:#eef0ff;font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;touch-action:manipulation;user-select:none}
h1{margin:0;font-size:1.8rem}
canvas{width:min(96vw,800px);aspect-ratio:8/3;border-radius:14px;background:#12163a;display:block;cursor:pointer}
p{margin:0;color:#9aa3d6;text-align:center}
</style>
</head>
<body>
<h1>Hop Hop</h1>
<canvas id="c" width="800" height="300" tabindex="0" aria-label="Jumping game"></canvas>
<p>Space, ↑, click or tap to jump. Hold for a higher jump.</p>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 300, GROUND = 240, GRAV = 0.65;
let state = 'ready', p, obs, speed, score, best = 0, last = 0, nextGap, off = 0, overAt = 0;

try { best = +localStorage.getItem('hophop-best') || 0; } catch (e) {}

function reset(){
  p = {x: 80, y: GROUND - 30, w: 30, h: 30, vy: 0, ground: true};
  obs = []; speed = 5; score = 0; nextGap = 60; off = 0;
}

function jump(){
  if (state === 'ready'){ state = 'play'; reset(); }
  else if (state === 'over'){ if (performance.now() - overAt > 350){ state = 'play'; reset(); } return; }
  if (p.ground){ p.vy = -13; p.ground = false; }
}
function release(){ if (state === 'play' && p.vy < -5) p.vy = -5; }

addEventListener('keydown', e => {
  if (['Space','ArrowUp'].includes(e.code)){ e.preventDefault(); if (!e.repeat) jump(); }
});
addEventListener('keyup', e => { if (['Space','ArrowUp'].includes(e.code)) release(); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
addEventListener('pointerup', release);

function spawn(){
  const h = 30 + Math.random() * 30, w = 20 + Math.random() * 20;
  obs.push({x: W + 20, w, h});
  if (Math.random() < 0.3) obs.push({x: W + 20 + w, w: 20, h: h - 8});
  nextGap = 260 + Math.random() * 260 + speed * 18;
}

function update(dt){
  speed = 5 + Math.min(score / 400, 6);
  off += speed * dt;
  score += speed * dt * 0.1;
  p.vy += GRAV * dt;
  p.y += p.vy * dt;
  if (p.y >= GROUND - p.h){ p.y = GROUND - p.h; p.vy = 0; p.ground = true; }
  nextGap -= speed * dt;
  if (nextGap <= 0) spawn();
  obs.forEach(o => o.x -= speed * dt);
  obs = obs.filter(o => o.x + o.w > -10);
  for (const o of obs){
    const m = 4;
    if (p.x + p.w - m > o.x && p.x + m < o.x + o.w && p.y + p.h - m > GROUND - o.h){
      state = 'over'; overAt = performance.now();
      if (score > best){
        best = score;
        try { localStorage.setItem('hophop-best', Math.floor(best)); } catch (e) {}
      }
    }
  }
}

function draw(){
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#0d1030'); g.addColorStop(1, '#4a2f78');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(650, 60, 26, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a2058';
  for (let i = -1; i < 6; i++){
    const x = i * 200 - (off * 0.2) % 200;
    ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 100, GROUND - 90); ctx.lineTo(x + 200, GROUND); ctx.fill();
  }
  ctx.fillStyle = '#1a1442'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#ffb454'; ctx.fillRect(0, GROUND, W, 3);
  for (let x = -(off % 60); x < W; x += 60) ctx.fillRect(x, GROUND + 22, 20, 2);

  ctx.fillStyle = '#ff5d73';
  obs.forEach(o => ctx.fillRect(o.x, GROUND - o.h, o.w, o.h));

  ctx.fillStyle = '#ffd166'; ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = '#1a1442'; ctx.fillRect(p.x + 18, p.y + 7, 6, 6);

  ctx.fillStyle = '#eef0ff'; ctx.font = '20px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`Best ${Math.floor(best)}   Score ${Math.floor(score)}`, W - 16, 30);
  ctx.textAlign = 'center';
  if (state === 'ready'){ ctx.font = '28px "Trebuchet MS", sans-serif'; ctx.fillText('Press space or tap to start', W / 2, 130); }
  if (state === 'over'){
    ctx.font = '34px "Trebuchet MS", sans-serif'; ctx.fillText('Crashed! Score ' + Math.floor(score), W / 2, 115);
    ctx.font = '20px "Trebuchet MS", sans-serif'; ctx.fillText('Press space or tap to try again', W / 2, 150);
  }
}

function loop(t){
  const dt = Math.min((t - last) / 16.67, 2); last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(t => { last = t; loop(t); });
</script>
</body>
</html>
